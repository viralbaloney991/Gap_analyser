syntax = "proto3";

package com.coralogixapis.alerts.v3;

option go_package = "coralogix-alert-analyzer/internal/coralogix/proto;alertspb";

import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";

// Wire-compatible with google.protobuf.StringValue but uses bytes to
// avoid proto3 UTF-8 enforcement on data from Coralogix.
message StrVal {
  bytes value = 1;
}

// ── Service ────────────────────────────────────────────────────────

service AlertDefsService {
  rpc ListAlertDefs(ListAlertDefsRequest) returns (ListAlertDefsResponse);
  rpc GetAlertDef(GetAlertDefRequest) returns (GetAlertDefResponse);
}

// ── Requests / Responses ───────────────────────────────────────────

message ListAlertDefsRequest {}

message ListAlertDefsResponse {
  repeated AlertDef alert_defs = 1;
}

message GetAlertDefRequest {
  StrVal id = 1;
}

message GetAlertDefResponse {
  AlertDef alert_def = 1;
}

// ── Core Messages ──────────────────────────────────────────────────

message AlertDef {
  AlertDefProperties alert_def_properties = 1;
  StrVal id = 2;
  StrVal alert_version_id = 20;
  google.protobuf.Timestamp created_time = 3;
  google.protobuf.Timestamp updated_time = 4;
  google.protobuf.Timestamp last_triggered_time = 5;
}

message AlertDefProperties {
  StrVal name = 1;
  StrVal description = 2;
  google.protobuf.BoolValue enabled = 3;
  AlertDefPriority priority = 4;
  oneof schedule {
    ActivitySchedule active_on = 5;
  }
  AlertDefType type = 6;
  oneof type_definition {
    LogsImmediateType logs_immediate = 101;
    TracingImmediateType tracing_immediate = 102;
    LogsThresholdType logs_threshold = 103;
    LogsRatioThresholdType logs_ratio_threshold = 104;
    LogsTimeRelativeThresholdType logs_time_relative_threshold = 105;
    MetricThresholdType metric_threshold = 106;
    TracingThresholdType tracing_threshold = 107;
    FlowType flow = 108;
    LogsAnomalyType logs_anomaly = 109;
    MetricAnomalyType metric_anomaly = 110;
    LogsNewValueType logs_new_value = 111;
    LogsUniqueCountType logs_unique_count = 112;
  }
  repeated StrVal group_by_keys = 7;
  AlertDefIncidentSettings incidents_settings = 8;
  AlertDefNotificationGroup notification_group = 9;
  map<string, bytes> entity_labels = 10;
  google.protobuf.BoolValue phantom_mode = 11;
  google.protobuf.BoolValue deleted = 12;
}

// ── Enums ──────────────────────────────────────────────────────────

enum AlertDefPriority {
  ALERT_DEF_PRIORITY_P5_OR_UNSPECIFIED = 0;
  ALERT_DEF_PRIORITY_P1 = 1;
  ALERT_DEF_PRIORITY_P2 = 2;
  ALERT_DEF_PRIORITY_P3 = 3;
  ALERT_DEF_PRIORITY_P4 = 4;
  ALERT_DEF_PRIORITY_P5 = 5;
}

enum AlertDefType {
  ALERT_DEF_TYPE_LOGS_IMMEDIATE_OR_UNSPECIFIED = 0;
  ALERT_DEF_TYPE_LOGS_THRESHOLD = 1;
  ALERT_DEF_TYPE_LOGS_RATIO_THRESHOLD = 2;
  ALERT_DEF_TYPE_LOGS_TIME_RELATIVE_THRESHOLD = 3;
  ALERT_DEF_TYPE_LOGS_ANOMALY = 4;
  ALERT_DEF_TYPE_LOGS_NEW_VALUE = 5;
  ALERT_DEF_TYPE_LOGS_UNIQUE_COUNT = 6;
  ALERT_DEF_TYPE_METRIC_THRESHOLD = 7;
  ALERT_DEF_TYPE_METRIC_ANOMALY = 8;
  ALERT_DEF_TYPE_TRACING_IMMEDIATE = 9;
  ALERT_DEF_TYPE_TRACING_THRESHOLD = 10;
  ALERT_DEF_TYPE_FLOW = 11;
}

// ── Schedule ───────────────────────────────────────────────────────

message ActivitySchedule {
  repeated DayOfWeek day_of_week = 1;
  TimeOfDay start_time = 2;
  TimeOfDay end_time = 3;
}

enum DayOfWeek {
  DAY_OF_WEEK_MONDAY_OR_UNSPECIFIED = 0;
  DAY_OF_WEEK_TUESDAY = 1;
  DAY_OF_WEEK_WEDNESDAY = 2;
  DAY_OF_WEEK_THURSDAY = 3;
  DAY_OF_WEEK_FRIDAY = 4;
  DAY_OF_WEEK_SATURDAY = 5;
  DAY_OF_WEEK_SUNDAY = 6;
}

message TimeOfDay {
  int32 hours = 1;
  int32 minutes = 2;
}

// ── Notification ───────────────────────────────────────────────────

message AlertDefIncidentSettings {
  google.protobuf.Int32Value notify_on = 1;
}

message AlertDefNotificationGroup {
  repeated StrVal group_by_fields = 1;
}

// ── Alert Type Definitions (simplified for read-only use) ──────────

message LogsFilter {
  StrVal lucene_filter = 1;
  repeated LogsFilterAlias alias_filters = 2;
}

message LogsFilterAlias {
  StrVal alias = 1;
  StrVal id = 2;
}

message LogsImmediateType {
  LogsFilter logs_filter = 1;
  repeated LogsImmediateTypeNotificationPayloadFilter notification_payload_filter = 2;
}

message LogsImmediateTypeNotificationPayloadFilter {
  StrVal field = 1;
}

message LogsThresholdType {
  LogsFilter logs_filter = 1;
  repeated LogsThresholdCondition conditions = 2;
  repeated StrVal notification_payload_filter = 3;
}

message LogsThresholdCondition {
  StrVal threshold = 1;
  TimeWindow time_window = 2;
  StrVal condition_type = 3;
}

message TimeWindow {
  StrVal value = 1;
}

message LogsRatioThresholdType {
  LogsFilter numerator = 1;
  LogsFilter denominator = 2;
  repeated LogsThresholdCondition conditions = 3;
}

message LogsTimeRelativeThresholdType {
  LogsFilter logs_filter = 1;
  repeated LogsThresholdCondition conditions = 2;
}

message LogsAnomalyType {
  LogsFilter logs_filter = 1;
  repeated LogsThresholdCondition conditions = 2;
}

message LogsNewValueType {
  LogsFilter logs_filter = 1;
  repeated StrVal keypath_to_track = 2;
  TimeWindow time_window = 3;
}

message LogsUniqueCountType {
  LogsFilter logs_filter = 1;
  StrVal unique_count_keypath = 2;
  repeated LogsThresholdCondition conditions = 3;
}

message TracingImmediateType {
  TracingFilter tracing_filter = 1;
}

message TracingFilter {
  repeated TracingFilterField latency_threshold_ms = 1;
  repeated TracingFilterField tag_filters = 2;
}

message TracingFilterField {
  StrVal field = 1;
  repeated StrVal values = 2;
}

message TracingThresholdType {
  TracingFilter tracing_filter = 1;
  repeated LogsThresholdCondition conditions = 2;
}

message MetricThresholdType {
  StrVal metric_filter = 1;
  repeated LogsThresholdCondition conditions = 2;
}

message MetricAnomalyType {
  StrVal metric_filter = 1;
  repeated LogsThresholdCondition conditions = 2;
}

message FlowType {
  repeated FlowStage stages = 1;
}

message FlowStage {
  repeated FlowStageGroup groups = 1;
  TimeWindow timeframe = 2;
}

message FlowStageGroup {
  LogsFilter logs_filter = 1;
  StrVal alert_def_id = 2;
}
